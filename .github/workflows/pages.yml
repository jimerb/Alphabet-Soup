name: Deploy Alphabet Soup to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build for the project Pages URL
        env:
          NEXT_PUBLIC_BASE_PATH: /Alphabet-Soup
        run: pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
